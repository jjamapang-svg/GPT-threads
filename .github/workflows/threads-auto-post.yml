name: Scheduled Threads posts

on:
  schedule:
    # 9am, noon, and 6pm America/New_York. Python chooses the valid DST hour.
    - cron: '0 13,14,16,17,22,23 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Post now, outside the normal Eastern Time schedule'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: threads-kim031476
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Generate and publish one scheduled post
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-terra
          FORCE_POST: ${{ inputs.force }}
        run: |
          if [ "$FORCE_POST" = "true" ]; then
            python threads_automation.py post --force
          else
            python threads_automation.py post
          fi
