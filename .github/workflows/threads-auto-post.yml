name: Scheduled Threads posts

on:
  schedule:
    # GitHub cron uses UTC. These are 9am, 1pm, and 6pm America/New_York
    # during Eastern Daylight Time. Each scheduled run force-publishes exactly
    # one post, avoiding false "No post due" skips caused by delayed cron starts.
    - cron: '0 13,17,22 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Post now, outside the normal Eastern Time schedule'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: threads-kim031476
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Generate and publish one scheduled post
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-terra
          OPENAI_REASONING_EFFORT: medium
          FORCE_POST: ${{ inputs.force }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "$FORCE_POST" = "true" ]; then
            python threads_automation.py post --force
          else
            echo "Manual run requested without force; no post published."
          fi
