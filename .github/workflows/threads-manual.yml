name: Threads diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [post_threads.py, requirements.txt, 'tests/**', .github/workflows/threads-manual.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Validate image, account, and previous published post (read only)
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python post_threads.py diagnose
